version: 2

project_name: cfctl

before:
  hooks:
    - go mod tidy

builds:
  - id: cfctl
    binary: cfctl
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - cfctl
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  disable: true
